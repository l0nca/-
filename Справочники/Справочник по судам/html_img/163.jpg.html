	<title>Баржа-площадка грузоподъёмностью 300т. Класс"*Р"(№658 и 658А) и Класс"*О"(№670)</title>

<script language="JavaScript" type="text/javascript">
function ms()
{

var xR=1446;
var yR=982;
var xW=screen.width-50;
var yW=screen.height-50;
var xx=document.images.item("1").width;

if(xR>xW){
if(xR>=yR){
if(xx==xR){xx=xW}else{xx=xR}
document.images.item("1").width=xx;
}else{
if(yy==yR){yy=yW}else{yy=yR}
document.images.item("1").height=yy;}}
}
</script>

</head>

<body>
