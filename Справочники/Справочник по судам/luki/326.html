<h2>Люковые закрытия</h2>
Система раскрытия люков - одновременное 100%-ное раскрытие двух трюмов. Каждый трюм закрыт восемью крышками, открывающимися от середины трюма к концу по четыре створки "гармошкой".
<br>
Управление системой раскрытия люков - посредством гидравлических манипуляторов.
