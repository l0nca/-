<h2> Люковые закрытия </h2>

Стальные сдвижные крышки на катках, перемещаются с помощью брашпиля. При открывании устанавливаются в два яруса.
<BR><BR>
<i><b> Количество люковых крышек </b></i><BR>

Над носовыми люками - 6 люковых крышек, над средними люками - 16 и над кормовыми - 4.
