<h2>Люковые закрытия</h2>
Они телескопические двухъярусные брызгонепроницаемые. Раскрытие грузового трюма 50%.
<br>
Каждый ярус закрытия состоит из четырёх крышек.
<br>
Перемещение крышек происходит при помощи носового шпиля.
