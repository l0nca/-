<body>
<h2>Люковые закрытия</h2>
Схема раскрытия люков - крышки трюмов 1 и 3 поднимаются вертикальными домкратами;
крышки трюмов 2 и 4 передвигаются в горизонтальном направлении лебёдками вместе с крышками трюмов 1 и 3 соответственно.
Подъём крышек трюмов 2 и 4 осуществляется с помощью горизонтальных домкратов.
