<h2>люковые закрытия</h2>
Брызгонепроницаемые телескопические трёхъярусные; состоят из семи стальных передвижных щитов. Нижний и средний ярусы состоят из трёх щитов. Верхний ярус образован порталом грузового крана. Максимальное возможное раскрытие люков 59%. Лебёдки передвижения щитов ЛРС-0,5, ручная.
