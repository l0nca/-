<h2>Люковое закрытие</h2>
Брызгонепроницаемое, из восьми высоких крышек, передвигаемых по комингсам на роликах. Крышки расположены в два яруса, 4 нижние крышки и 4 верхние крышки изготовлены из гофрированной стали толщиной 2 мм.
